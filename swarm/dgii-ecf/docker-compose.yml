x-engine-worker-env: &engine-worker-env
  NODE_ENV: ${NODE_ENV:-production}
  APP_VERSION: ${DGII_ECF_ENGINE_TAG}
  TRUST_PROXY: ${TRUST_PROXY:-1}

  CERT_MASTER_KEY_BASE64: ${CERT_MASTER_KEY_BASE64:?CERT_MASTER_KEY_BASE64 requerido}
  INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN requerido}
  API_KEY_PEPPER: ${API_KEY_PEPPER:?API_KEY_PEPPER requerido}
  APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET requerido}

  DATABASE_ENABLED: ${DATABASE_ENABLED:-true}
  POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:5432/${POSTGRES_DB}?schema=public
  DATABASE_LOG_QUERIES: ${DATABASE_LOG_QUERIES:-false}
  RUN_PRISMA_MIGRATE_ON_BOOT: "false"
  NPM_CONFIG_UPDATE_NOTIFIER: ${NPM_CONFIG_UPDATE_NOTIFIER:-false}

  REDIS_ENABLED: ${REDIS_ENABLED:-true}
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD requerido}@redis:6379
  REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-dgii-ecf-engine-local}
  REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS:-5000}
  REDIS_COMMAND_TIMEOUT_MS: ${REDIS_COMMAND_TIMEOUT_MS:-3000}
  DISTRIBUTED_LOCK_TTL_MS: ${DISTRIBUTED_LOCK_TTL_MS:-120000}
  DISTRIBUTED_LOCK_WAIT_MS: ${DISTRIBUTED_LOCK_WAIT_MS:-120000}
  DISTRIBUTED_LOCK_RETRY_DELAY_MS: ${DISTRIBUTED_LOCK_RETRY_DELAY_MS:-150}
  DISTRIBUTED_LOCK_REQUIRE_REDIS_IN_PRODUCTION: ${DISTRIBUTED_LOCK_REQUIRE_REDIS_IN_PRODUCTION:-true}
  RATE_LIMIT_REDIS_FAIL_OPEN: ${RATE_LIMIT_REDIS_FAIL_OPEN:-true}

  APP_DATA_DIR: ${APP_DATA_DIR:-/data}
  APP_LOG_DIR: ${APP_LOG_DIR:-/logs}
  TRANSACTIONS_DIR: ${TRANSACTIONS_DIR:-/data/transactions}
  CERT_STORE_DIR: ${CERT_STORE_DIR:-/data/certificates}
  REGISTRY_FILE: ${REGISTRY_FILE:-/data/registry.json}
  API_KEYS_FILE: ${API_KEYS_FILE:-/data/api_keys.json}
  USERS_FILE: ${USERS_FILE:-/data/users.json}
  AUDIT_LOG_FILE: ${AUDIT_LOG_FILE:-/logs/audit.log}

  DGII_HTTP_TIMEOUT_MS: ${DGII_HTTP_TIMEOUT_MS:-45000}
  BUYER_DELIVERY_TIMEOUT_MS: ${BUYER_DELIVERY_TIMEOUT_MS:-15000}
  XML_VALIDATION_TIMEOUT_MS: ${XML_VALIDATION_TIMEOUT_MS:-10000}
  WORKER_JOB_TIMEOUT_MS: ${WORKER_JOB_TIMEOUT_MS:-120000}
  XML_XSD_VALIDATION_ENABLED: ${XML_XSD_VALIDATION_ENABLED:-true}
  XML_VALIDATOR_PYTHON: ${XML_VALIDATOR_PYTHON:-python3}

  SAVE_TRANSACTIONS: ${SAVE_TRANSACTIONS:-true}
  SAVE_TRANSACTIONS_INCLUDE_JSON: ${SAVE_TRANSACTIONS_INCLUDE_JSON:-true}
  SAVE_TRANSACTIONS_INCLUDE_RESPONSE: ${SAVE_TRANSACTIONS_INCLUDE_RESPONSE:-true}

  FE_RECEPTION_DEFAULT_ENV: ${FE_RECEPTION_DEFAULT_ENV:-TesteCF}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_PRETTY: ${LOG_PRETTY:-false}
  QUEUE_SCHEDULER_ENABLED: "false"
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}

x-engine-worker-service: &engine-worker-service
  image: ${DGII_ECF_ENGINE_IMAGE}:${DGII_ECF_ENGINE_TAG}
  entrypoint: ["/bin/sh", "-c"]
  volumes:
    - dgii_ecf_engine_data:/data
    - dgii_ecf_engine_logs:/logs
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 60s
  logging:
    driver: json-file
    options:
      max-size: ${LOG_MAX_SIZE:-10m}
      max-file: ${LOG_MAX_FILES:-5}

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres}:${POSTGRES_TAG:-18-alpine}
    command:
      - postgres
      # Conexiones
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-100}
      # Memoria
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-1GB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-128MB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-4MB}
      # WAL y checkpoints
      - -c
      - wal_compression=${POSTGRES_WAL_COMPRESSION:-lz4}
      - -c
      - checkpoint_completion_target=${POSTGRES_CHECKPOINT_COMPLETION_TARGET:-0.9}
      - -c
      - checkpoint_timeout=${POSTGRES_CHECKPOINT_TIMEOUT:-15min}
      - -c
      - min_wal_size=${POSTGRES_MIN_WAL_SIZE:-512MB}
      - -c
      - max_wal_size=${POSTGRES_MAX_WAL_SIZE:-2GB}
      # SSD/NVMe
      - -c
      - random_page_cost=${POSTGRES_RANDOM_PAGE_COST:-1.1}
      - -c
      - effective_io_concurrency=${POSTGRES_EFFECTIVE_IO_CONCURRENCY:-200}

      # Monitoreo y diagnóstico
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - track_io_timing=${POSTGRES_TRACK_IO_TIMING:-on}
      - -c
      - log_checkpoints=${POSTGRES_LOG_CHECKPOINTS:-on}
      - -c
      - log_lock_waits=${POSTGRES_LOG_LOCK_WAITS:-on}
      - -c
      - log_min_duration_statement=${POSTGRES_LOG_MIN_DURATION_STATEMENT:-1000}
      - -c
      - deadlock_timeout=${POSTGRES_DEADLOCK_TIMEOUT:-1s}

      # Protección frente a sesiones abandonadas
      - -c
      - idle_in_transaction_session_timeout=${POSTGRES_IDLE_TRANSACTION_TIMEOUT:-5min}
      - -c
      - statement_timeout=${POSTGRES_STATEMENT_TIMEOUT:-0}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB requerido}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER requerido}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido}
    volumes:
      - dgii_ecf_postgres_data:/var/lib/postgresql
    tmpfs:
      - /dev/shm:size=${POSTGRES_SHM_SIZE:-512mb},mode=1777
    shm_size: "${POSTGRES_SHM_SIZE:-256mb}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: ${POSTGRES_HEALTH_INTERVAL:-10s}
      timeout: ${POSTGRES_HEALTH_TIMEOUT:-5s}
      retries: ${POSTGRES_HEALTH_RETRIES:-30}
      start_period: ${POSTGRES_HEALTH_START_PERIOD:-120s}
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILES:-5}
    deploy:
      mode: replicated
      replicas: 1

      placement:
        constraints:
          - node.labels.postgres == true

      resources:
        limits:
          cpus: "${POSTGRES_CPU_LIMIT:-2.00}"
          memory: "${POSTGRES_MEM_LIMIT:-2G}"
        reservations:
          cpus: "${POSTGRES_CPU_RESERVATION:-0.50}"
          memory: "${POSTGRES_MEM_RESERVATION:-1G}"

      restart_policy:
        condition: any
        delay: ${POSTGRES_RESTART_DELAY:-10s}
        window: ${POSTGRES_RESTART_WINDOW:-180s}

      update_config:
        parallelism: 1
        order: stop-first
        delay: 10s
        monitor: 60s
        failure_action: rollback

      rollback_config:
        parallelism: 1
        order: stop-first
        monitor: 60s

      labels:
        - com.dgii-ecf.service=postgres
        - com.dgii-ecf.component=database

  pgadmin:
    image: ${PGADMIN_IMAGE:-dpage/pgadmin4}:${PGADMIN_TAG:-9.14.0}
    volumes:
      - dgii_ecf_pgadmin_data:/var/lib/pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?PGADMIN_DEFAULT_EMAIL requerido}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD requerido}
    security_opt:
      - no-new-privileges:true
    networks:
      - default
      - proxy
    labels:
      - com.dgii-ecf.service=pgadmin
      - com.dgii-ecf.component=database
      - traefik.enable=true
      - traefik.docker.network=${NETWORK:-proxy}
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-dgii-ecf}-pgadmin-http.rule=Host(`${PGADMIN_DOMAIN}`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-dgii-ecf}-pgadmin-http.entrypoints=web
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-dgii-ecf}-pgadmin-http.middlewares=${COMPOSE_PROJECT_NAME:-dgii-ecf}-pgadmin-https-redirect
      - traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-dgii-ecf}-pgadmin-https-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-dgii-ecf}-pgadmin-https-redirect.redirectscheme.permanent=true
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-dgii-ecf}-pgadmin.rule=Host(`${PGADMIN_DOMAIN}`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-dgii-ecf}-pgadmin.entrypoints=websecure
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-dgii-ecf}-pgadmin.tls=true
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-dgii-ecf}-pgadmin.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-dgii-ecf}-pgadmin.service=${COMPOSE_PROJECT_NAME:-dgii-ecf}-pgadmin
      - traefik.http.services.${COMPOSE_PROJECT_NAME:-dgii-ecf}-pgadmin.loadbalancer.server.port=80
    deploy:
      mode: replicated
      replicas: 1

      restart_policy:
        condition: any
        delay: ${POSTGRES_RESTART_DELAY:-10s}
        window: ${POSTGRES_RESTART_WINDOW:-180s}

      labels:
        - com.dgii-ecf.service=pgadmin
        - com.dgii-ecf.component=database
        - traefik.enable=true
        - traefik.docker.network=${NETWORK:-proxy}
        - traefik.http.routers.${COMPOSE_PROJECT_NAME:-dgii-ecf}-pgadmin-http.rule=Host(`${PGADMIN_DOMAIN}`)
        - traefik.http.routers.${COMPOSE_PROJECT_NAME:-dgii-ecf}-pgadmin-http.entrypoints=web
        - traefik.http.routers.${COMPOSE_PROJECT_NAME:-dgii-ecf}-pgadmin-http.middlewares=${COMPOSE_PROJECT_NAME:-dgii-ecf}-pgadmin-https-redirect
        - traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-dgii-ecf}-pgadmin-https-redirect.redirectscheme.scheme=https
        - traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-dgii-ecf}-pgadmin-https-redirect.redirectscheme.permanent=true
        - traefik.http.routers.${COMPOSE_PROJECT_NAME:-dgii-ecf}-pgadmin.rule=Host(`${PGADMIN_DOMAIN}`)
        - traefik.http.routers.${COMPOSE_PROJECT_NAME:-dgii-ecf}-pgadmin.entrypoints=websecure
        - traefik.http.routers.${COMPOSE_PROJECT_NAME:-dgii-ecf}-pgadmin.tls=true
        - traefik.http.routers.${COMPOSE_PROJECT_NAME:-dgii-ecf}-pgadmin.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
        - traefik.http.routers.${COMPOSE_PROJECT_NAME:-dgii-ecf}-pgadmin.service=${COMPOSE_PROJECT_NAME:-dgii-ecf}-pgadmin
        - traefik.http.services.${COMPOSE_PROJECT_NAME:-dgii-ecf}-pgadmin.loadbalancer.server.port=80

  redis:
    image: ${REDIS_IMAGE:-redis}:${REDIS_TAG:-8.8.1-alpine}
    command:
      - redis-server
      - --appendonly
      - ${REDIS_APPENDONLY:-yes}
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD requerido}
      - --protected-mode
      - "yes"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD requerido}
    volumes:
      - dgii_ecf_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning --pass \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: ${REDIS_HEALTH_INTERVAL:-10s}
      timeout: ${REDIS_HEALTH_TIMEOUT:-5s}
      retries: ${REDIS_HEALTH_RETRIES:-12}
      start_period: ${REDIS_HEALTH_START_PERIOD:-20s}
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILES:-5}
    deploy:
      mode: replicated
      replicas: 1

      restart_policy:
        condition: any
        delay: ${POSTGRES_RESTART_DELAY:-10s}
        window: ${POSTGRES_RESTART_WINDOW:-180s}

      labels:
        - com.dgii-ecf.service=redis
        - com.dgii-ecf.component=database

  redisinsight:
    image: ${REDISINSIGHT_IMAGE:-redis/redisinsight}:${REDISINSIGHT_TAG:-3.4.2}
    volumes:
      - dgii_ecf_redisinsight_data:/data
    environment:
      RI_REDIS_USERNAME: ${RI_REDIS_USERNAME:-default}
      RI_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD requerido}
    security_opt:
      - no-new-privileges:true
    networks:
      - default
      - proxy
    labels:
      - com.dgii-ecf.service=redisinsight
      - com.dgii-ecf.component=database
      - traefik.enable=true
      - traefik.docker.network=${NETWORK:-proxy}
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-dgii-ecf}-redisinsight-http.rule=Host(`${REDISINSIGHT_DOMAIN}`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-dgii-ecf}-redisinsight-http.entrypoints=web
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-dgii-ecf}-redisinsight-http.middlewares=${COMPOSE_PROJECT_NAME:-dgii-ecf}-redisinsight-https-redirect
      - traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-dgii-ecf}-redisinsight-https-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-dgii-ecf}-redisinsight-https-redirect.redirectscheme.permanent=true
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-dgii-ecf}-redisinsight.rule=Host(`${REDISINSIGHT_DOMAIN}`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-dgii-ecf}-redisinsight.entrypoints=websecure
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-dgii-ecf}-redisinsight.tls=true
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-dgii-ecf}-redisinsight.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-dgii-ecf}-redisinsight.service=${COMPOSE_PROJECT_NAME:-dgii-ecf}-redisinsight
      - traefik.http.services.${COMPOSE_PROJECT_NAME:-dgii-ecf}-redisinsight.loadbalancer.server.port=5540

    deploy:
      mode: replicated
      replicas: 1

      restart_policy:
        condition: any
        delay: ${POSTGRES_RESTART_DELAY:-10s}
        window: ${POSTGRES_RESTART_WINDOW:-180s}

      labels:
        - com.dgii-ecf.service=redisinsight
        - com.dgii-ecf.component=database
        - traefik.enable=true
        - traefik.docker.network=${NETWORK:-proxy}
        - traefik.http.routers.${COMPOSE_PROJECT_NAME:-dgii-ecf}-redisinsight-http.rule=Host(`${REDISINSIGHT_DOMAIN}`)
        - traefik.http.routers.${COMPOSE_PROJECT_NAME:-dgii-ecf}-redisinsight-http.entrypoints=web
        - traefik.http.routers.${COMPOSE_PROJECT_NAME:-dgii-ecf}-redisinsight-http.middlewares=${COMPOSE_PROJECT_NAME:-dgii-ecf}-redisinsight-https-redirect
        - traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-dgii-ecf}-redisinsight-https-redirect.redirectscheme.scheme=https
        - traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-dgii-ecf}-redisinsight-https-redirect.redirectscheme.permanent=true
        - traefik.http.routers.${COMPOSE_PROJECT_NAME:-dgii-ecf}-redisinsight.rule=Host(`${REDISINSIGHT_DOMAIN}`)
        - traefik.http.routers.${COMPOSE_PROJECT_NAME:-dgii-ecf}-redisinsight.entrypoints=websecure
        - traefik.http.routers.${COMPOSE_PROJECT_NAME:-dgii-ecf}-redisinsight.tls=true
        - traefik.http.routers.${COMPOSE_PROJECT_NAME:-dgii-ecf}-redisinsight.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
        - traefik.http.routers.${COMPOSE_PROJECT_NAME:-dgii-ecf}-redisinsight.service=${COMPOSE_PROJECT_NAME:-dgii-ecf}-redisinsight
        - traefik.http.services.${COMPOSE_PROJECT_NAME:-dgii-ecf}-redisinsight.loadbalancer.server.port=5540

  dgii-ecf-engine-migrate:
    image: ${DGII_ECF_ENGINE_IMAGE}:${DGII_ECF_ENGINE_TAG}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Esperando a que postgres acepte conexiones..."
        i=0
        until node -e 'const net = require("net"); const host = process.env.POSTGRES_HOST || "postgres"; const socket = net.createConnection(5432, host); socket.once("connect", () => { socket.destroy(); process.exit(0); }); socket.once("error", () => process.exit(1)); socket.setTimeout(3000, () => { socket.destroy(); process.exit(1); });'; do
          i=$$((i+1))
          if [ "$$i" -ge 40 ]; then
            echo "Timeout esperando a $${POSTGRES_HOST}:5432, abortando."
            exit 1
          fi
          echo "$${POSTGRES_HOST}:5432 no disponible aún (intento $$i), reintentando en 3s..."
          sleep 3
        done
        echo "$${POSTGRES_HOST}:5432 listo, ejecutando migraciones..."
        exec npx prisma migrate deploy
    environment:
      CERT_MASTER_KEY_BASE64: ${CERT_MASTER_KEY_BASE64:?CERT_MASTER_KEY_BASE64 requerido}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN requerido}
      API_KEY_PEPPER: ${API_KEY_PEPPER:?API_KEY_PEPPER requerido}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET requerido}
      DATABASE_ENABLED: ${DATABASE_ENABLED:-true}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER requerido}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB requerido}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:5432/${POSTGRES_DB}?schema=public
      RUN_PRISMA_MIGRATE_ON_BOOT: "false"
    volumes:
      - dgii_ecf_engine_data:/data
      - dgii_ecf_engine_logs:/logs
    security_opt:
      - no-new-privileges:true
    deploy:
      mode: replicated-job
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 5
        delay: 5s
      labels:
        - com.dgii-ecf.service=dgii-ecf-engine-migrate

  dgii-ecf-engine:
    image: ${DGII_ECF_ENGINE_IMAGE}:${DGII_ECF_ENGINE_TAG}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Esperando conectividad con $${POSTGRES_HOST}:5432..."
        i=0
        until node -e 'const net = require("net"); const host = process.env.POSTGRES_HOST || "postgres"; const socket = net.createConnection(5432, host); socket.once("connect", () => { socket.destroy(); process.exit(0); }); socket.once("error", () => process.exit(1)); socket.setTimeout(3000, () => { socket.destroy(); process.exit(1); });'; do
          i=$$((i+1))
          if [ "$$i" -ge 40 ]; then
            echo "Timeout esperando a $${POSTGRES_HOST}:5432, abortando."
            exit 1
          fi
          echo "$${POSTGRES_HOST}:5432 no disponible aún (intento $$i), reintentando en 3s..."
          sleep 3
        done

        echo "Verificando estado de migraciones..."
        until npx prisma migrate status --schema=./prisma/schema.prisma 2>&1 | grep -q "Database schema is up to date"; do
          echo "Esperando a que dgii-ecf-engine-migrate complete..."
          sleep 5
        done

        echo "Migraciones al día, iniciando aplicación..."
        exec /app/docker-entrypoint.sh node dist/server.js
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      APP_VERSION: ${DGII_ECF_ENGINE_TAG}
      PORT: ${DGII_ECF_ENGINE_PORT:-4000}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      CORS_ALLOWED_ORIGINS: ${PORTAL_PUBLIC_URL:?PORTAL_PUBLIC_URL requerido}

      PLATFORM_ADMIN_BOOTSTRAP_ENABLED: ${PLATFORM_ADMIN_BOOTSTRAP_ENABLED:-true}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-admin@example.com}
      PLATFORM_ADMIN_FULL_NAME: ${PLATFORM_ADMIN_FULL_NAME:-Administrator}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD}
      PLATFORM_ADMIN_RESET_PASSWORD_ON_BOOT: ${PLATFORM_ADMIN_RESET_PASSWORD_ON_BOOT:-false}

      CERT_MASTER_KEY_BASE64: ${CERT_MASTER_KEY_BASE64:?CERT_MASTER_KEY_BASE64 requerido}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN requerido}
      API_KEY_PEPPER: ${API_KEY_PEPPER:?API_KEY_PEPPER requerido}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET requerido}

      API_REQUEST_BODY_LIMIT: ${API_REQUEST_BODY_LIMIT:-2mb}
      HTTP_REQUEST_TIMEOUT_MS: ${HTTP_REQUEST_TIMEOUT_MS:-30000}
      HTTP_HEADERS_TIMEOUT_EXTRA_MS: ${HTTP_HEADERS_TIMEOUT_EXTRA_MS:-5000}
      HTTP_KEEP_ALIVE_TIMEOUT_MS: ${HTTP_KEEP_ALIVE_TIMEOUT_MS:-5000}

      EMAIL_VERIFICATION_REQUIRED: ${EMAIL_VERIFICATION_REQUIRED:-true}
      EMAIL_VERIFICATION_TOKEN_TTL_MINUTES: ${EMAIL_VERIFICATION_TOKEN_TTL_MINUTES:-60}
      PORTAL_PUBLIC_URL: ${PORTAL_PUBLIC_URL:?PORTAL_PUBLIC_URL requerido}

      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME}

      DGII_HTTP_TIMEOUT_MS: ${DGII_HTTP_TIMEOUT_MS:-45000}
      BUYER_DELIVERY_TIMEOUT_MS: ${BUYER_DELIVERY_TIMEOUT_MS:-15000}
      XML_VALIDATION_TIMEOUT_MS: ${XML_VALIDATION_TIMEOUT_MS:-10000}
      WORKER_JOB_TIMEOUT_MS: ${WORKER_JOB_TIMEOUT_MS:-120000}

      DATABASE_ENABLED: ${DATABASE_ENABLED:-true}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:5432/${POSTGRES_DB}?schema=public
      DATABASE_LOG_QUERIES: ${DATABASE_LOG_QUERIES:-false}
      RUN_PRISMA_MIGRATE_ON_BOOT: "false"
