  dgii-ecf-scheduler:
    <<: *engine-worker-service
    command:
      - |
        wait_for_tcp() {
          service_name="$$1"
          host="$$2"
          port="$$3"
          attempts="$${4:-40}"

          echo "Esperando conectividad con $$service_name ($$host:$$port)..."
          i=0
          until node -e 'const net = require("net"); const host = process.argv[1]; const port = Number(process.argv[2]); const socket = net.createConnection(port, host); socket.once("connect", () => { socket.destroy(); process.exit(0); }); socket.once("error", () => process.exit(1)); socket.setTimeout(3000, () => { socket.destroy(); process.exit(1); });' "$$host" "$$port"; do
            i=$$((i+1))
            if [ "$$i" -ge "$$attempts" ]; then
              echo "Timeout esperando a $$service_name ($$host:$$port), abortando."
              exit 1
            fi
            echo "$$service_name no disponible aún (intento $$i), reintentando en 3s..."
            sleep 3
          done
        }

        wait_for_tcp postgres "$${POSTGRES_HOST:-postgres}" 5432
        wait_for_tcp redis redis 6379

        echo "Verificando estado de migraciones..."
        until npx prisma migrate status --schema=./prisma/schema.prisma 2>&1 | grep -q "Database schema is up to date"; do
          echo "Esperando a que dgii-ecf-engine-migrate complete..."
          sleep 5
        done

        echo "Dependencias listas, iniciando scheduler..."
        exec /app/docker-entrypoint.sh node dist/workers/runQueueScheduler.js
    environment:
      <<: *engine-worker-env
      QUEUE_SCHEDULER_ENABLED: "true"
      QUEUE_SCHEDULER_RECOVERY_INTERVAL_MS: ${QUEUE_SCHEDULER_RECOVERY_INTERVAL_MS:-60000}
      QUEUE_SCHEDULER_MAX_RUNNING_MINUTES: ${QUEUE_SCHEDULER_MAX_RUNNING_MINUTES:-10}
    deploy:
      mode: replicated
      replicas: ${DGII_ECF_SCHEDULER_REPLICAS:-1}
      restart_policy:
        condition: any
        delay: ${SCHEDULER_RESTART_DELAY:-10s}
        window: ${SCHEDULER_RESTART_WINDOW:-180s}
      update_config:
        parallelism: 1
        order: stop-first
        delay: ${SCHEDULER_UPDATE_DELAY:-10s}
        monitor: ${SCHEDULER_UPDATE_MONITOR:-60s}
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
        monitor: ${SCHEDULER_ROLLBACK_MONITOR:-60s}
      labels:
        - com.dgii-ecf.service=dgii-ecf-scheduler
        - com.dgii-ecf.component=scheduler

  dgii-ecf-worker-send:
    <<: *engine-worker-service
    command:
      - |
        wait_for_tcp() {
          service_name="$$1"
          host="$$2"
          port="$$3"
          attempts="$${4:-40}"

          echo "Esperando conectividad con $$service_name ($$host:$$port)..."
          i=0
          until node -e 'const net = require("net"); const host = process.argv[1]; const port = Number(process.argv[2]); const socket = net.createConnection(port, host); socket.once("connect", () => { socket.destroy(); process.exit(0); }); socket.once("error", () => process.exit(1)); socket.setTimeout(3000, () => { socket.destroy(); process.exit(1); });' "$$host" "$$port"; do
            i=$$((i+1))
            if [ "$$i" -ge "$$attempts" ]; then
              echo "Timeout esperando a $$service_name ($$host:$$port), abortando."
              exit 1
            fi
            echo "$$service_name no disponible aún (intento $$i), reintentando en 3s..."
            sleep 3
          done
        }

        wait_for_tcp postgres "$${POSTGRES_HOST:-postgres}" 5432
        wait_for_tcp redis redis 6379

        echo "Verificando estado de migraciones..."
        until npx prisma migrate status --schema=./prisma/schema.prisma 2>&1 | grep -q "Database schema is up to date"; do
          echo "Esperando a que dgii-ecf-engine-migrate complete..."
          sleep 5
        done

        echo "Dependencias listas, iniciando worker send-normal..."
        exec /app/docker-entrypoint.sh node dist/workers/runQueueWorker.js --queue=send-normal --mode=loop --max="$${WORKER_SEND_MAX:-5}" --sleepMs="$${WORKER_SEND_SLEEP_MS:-3000}"
    environment:
      <<: *engine-worker-env
      PORT: "4001"
      WORKER_QUEUE: SEND_NORMAL
      WORKER_SEND_MAX: ${WORKER_SEND_MAX:-5}
      WORKER_SEND_SLEEP_MS: ${WORKER_SEND_SLEEP_MS:-3000}
    deploy:
      mode: replicated
      replicas: ${DGII_ECF_WORKER_SEND_REPLICAS:-2}
      restart_policy:
        condition: any
        delay: ${WORKER_RESTART_DELAY:-10s}
        window: ${WORKER_RESTART_WINDOW:-180s}
      update_config:
        parallelism: 1
        order: start-first
        delay: ${WORKER_UPDATE_DELAY:-10s}
        monitor: ${WORKER_UPDATE_MONITOR:-60s}
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
