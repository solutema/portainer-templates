services:
  postgres:
    container_name: ${COMPOSE_PROJECT_NAME:-dgii-rnc-directory}-postgres
    image: ${POSTGRES_IMAGE:-gitea.joseagrc.com/joseagrc/dgii-rnc-directory-postgresql}:${POSTGRES_TAG:-1.0.0}
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dgii_directory}
      POSTGRES_USER: ${POSTGRES_USER:-dgii}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS:---data-checksums}
    volumes:
      - dgii_rnc_directory_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILE:-3}

  api:
    container_name: ${COMPOSE_PROJECT_NAME:-dgii-rnc-directory}-api
    image: ${DIRECTORY_IMAGE:-gitea.joseagrc.com/joseagrc/dgii-rnc-directory-api}:${DIRECTORY_TAG:-1.0.0}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4080
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-dgii_directory}
      PGUSER: ${POSTGRES_USER:-dgii}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      API_KEY: ${API_KEY:?API_KEY is required}
      DGII_SOURCE: ${DGII_SOURCE:-txt}
      SYNC_CRON: "${SYNC_CRON:-0 */12 * * *}"
      SYNC_ON_STARTUP: ${SYNC_ON_STARTUP:-true}
      TZ: ${TZ:-America/Santo_Domingo}
      DGII_ELECTRONIC_DIRECTORY_ENABLED: ${DGII_ELECTRONIC_DIRECTORY_ENABLED:-true}
      DIRECTORY_CACHE_TTL_SECONDS: ${DIRECTORY_CACHE_TTL_SECONDS:-43200}
      DIRECTORY_TIMEOUT_MS: ${DIRECTORY_TIMEOUT_MS:-10000}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      MAX_IMPORT_AGE_HOURS: ${MAX_IMPORT_AGE_HOURS:-25}
      DGII_CREDENTIALS_MASTER_KEY: ${DGII_CREDENTIALS_MASTER_KEY:?DGII_CREDENTIALS_MASTER_KEY is required}
      DGII_CERTIFICATE_MAX_BYTES: ${DGII_CERTIFICATE_MAX_BYTES:-2097152}
      MAX_DOWNLOAD_BYTES: ${MAX_DOWNLOAD_BYTES:-104857600}
      MAX_UNCOMPRESSED_BYTES: ${MAX_UNCOMPRESSED_BYTES:-314572800}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4080/health/live >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-dgii-rnc-directory}-http.rule=Host(`${URL:-rnc-directory.example.com}`) || Host(`www.${URL:-rnc-directory.example.com}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-dgii-rnc-directory}-http.entrypoints=web"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-dgii-rnc-directory}-http.middlewares=${COMPOSE_PROJECT_NAME:-dgii-rnc-directory}-https-redirect"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-dgii-rnc-directory}-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-dgii-rnc-directory}.rule=Host(`${URL:-rnc-directory.example.com}`) || Host(`www.${URL:-rnc-directory.example.com}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-dgii-rnc-directory}.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-dgii-rnc-directory}.tls=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-dgii-rnc-directory}.tls.certresolver=letsencrypt"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME:-dgii-rnc-directory}.loadbalancer.server.port=4080"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILE:-3}

volumes:
  dgii_rnc_directory_postgres_data:

networks:
  default:
    name: ${NETWORK:-proxy}
    external: true
