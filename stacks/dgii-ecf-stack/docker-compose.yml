    environment:
      <<: *engine-env
      PORT: "4003"
      RUN_PRISMA_MIGRATE_ON_BOOT: "false"
      RATE_LIMIT_REDIS_FAIL_OPEN: ${RATE_LIMIT_REDIS_FAIL_OPEN:-true}
      XML_XSD_VALIDATION_ENABLED: ${XML_XSD_VALIDATION_ENABLED:-true}
      XML_VALIDATOR_PYTHON: ${XML_VALIDATOR_PYTHON:-python3}
      QUEUE_SCHEDULER_ENABLED: "false"
      WORKER_QUEUE: SEND_BULK
      WORKER_CONCURRENCY: ${WORKER_BULK_CONCURRENCY:-1}
      SERVICE_HEARTBEAT_NAME: worker-send-bulk
    healthcheck: *worker-heartbeat-healthcheck
    networks:
      - default
      - egress

  dgii-ecf-housekeeping:
    <<: *engine-service
    deploy:
      replicas: ${DGII_ECF_HOUSEKEEPING_REPLICAS:-1}
      resources: *utility-resources
      update_config:
        order: start-first
        failure_action: rollback
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      dgii-ecf-engine:
        condition: service_healthy
    command:
      - node
      - dist/workers/runHousekeepingWorker.js
      - --mode=loop
      - --sleepMs=${HOUSEKEEPING_WORKER_SLEEP_MS:-300000}
    environment:
      <<: *engine-env
      PORT: "4004"
      RUN_PRISMA_MIGRATE_ON_BOOT: "false"
      QUEUE_SCHEDULER_ENABLED: "false"
      HOUSEKEEPING_ENABLED: ${HOUSEKEEPING_ENABLED:-true}
      HOUSEKEEPING_INTERVAL_MS: ${HOUSEKEEPING_INTERVAL_MS:-300000}
      HOUSEKEEPING_QUEUE_DONE_RETENTION_DAYS: ${HOUSEKEEPING_QUEUE_DONE_RETENTION_DAYS:-7}
      HOUSEKEEPING_QUEUE_FAILED_RETENTION_DAYS: ${HOUSEKEEPING_QUEUE_FAILED_RETENTION_DAYS:-30}
      HOUSEKEEPING_QUEUE_ARCHIVE_RETENTION_DAYS: ${HOUSEKEEPING_QUEUE_ARCHIVE_RETENTION_DAYS:-90}
      HOUSEKEEPING_IDEMPOTENCY_PENDING_RETENTION_HOURS: ${HOUSEKEEPING_IDEMPOTENCY_PENDING_RETENTION_HOURS:-24}
      SERVICE_HEARTBEAT_NAME: housekeeping-worker
    healthcheck: *worker-heartbeat-healthcheck
    networks:
      - default
      - egress

  dgii-ecf-backup-automation:
    <<: *engine-service
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_healthy
    deploy:
      replicas: 1
      resources: *worker-resources
      update_config:
        order: stop-first
        failure_action: rollback
    command: ["node", "dist/workers/runBackupAutomationWorker.js"]
    environment:
      <<: *engine-env
      PORT: "4006"
      QUEUE_SCHEDULER_ENABLED: "false"
      BACKUP_AUTOMATION_SCHEDULER_ENABLED: "true"
      INSTANCE_BACKUP_AGENT_URL: ""
      INSTANCE_BACKUP_AGENT_PORT: "4006"
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      SERVICE_HEARTBEAT_NAME: backup-automation-worker
    volumes:
      - dgii_ecf_engine_data:/data
      - dgii_ecf_engine_logs:/logs
      - ${BACKUP_LOCAL_DIR:-./backups/automated}:/backups
    healthcheck: *worker-heartbeat-healthcheck
    networks:
      - default
      - backup_admin
      - egress

  docker-socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      EXEC: "1"
      ALLOW_START: "1"
      ALLOW_STOP: "1"
      ALLOW_RESTARTS: "1"
      IMAGES: "1"
      INFO: "1"
      NETWORKS: "1"
      PING: "1"
      POST: "1"
      VERSION: "1"
      VOLUMES: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - backup_admin
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /run
      - /tmp
      - /var/lib/haproxy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:2375/_ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging
    deploy:
      resources: *utility-resources

  dgii-ecf-webhook-worker:
    <<: *engine-service
    deploy:
      replicas: ${DGII_ECF_WEBHOOK_WORKER_REPLICAS:-1}
      resources: *utility-resources
      update_config:
        order: start-first
        failure_action: rollback
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      dgii-ecf-engine:
        condition: service_healthy
    command:
      - node
      - dist/workers/runWebhookWorker.js
      - --mode=loop
      - --max=${WEBHOOK_WORKER_MAX:-20}
      - --sleepMs=${WEBHOOK_WORKER_SLEEP_MS:-3000}
    environment:
      <<: *engine-env
      PORT: "4005"
      RUN_PRISMA_MIGRATE_ON_BOOT: "false"
      WEBHOOKS_ENABLED: ${WEBHOOKS_ENABLED:-true}
      WEBHOOK_WORKER_INTERVAL_MS: ${WEBHOOK_WORKER_INTERVAL_MS:-3000}
      WEBHOOK_MAX_ATTEMPTS: ${WEBHOOK_MAX_ATTEMPTS:-8}
      WEBHOOK_DEFAULT_TIMEOUT_MS: ${WEBHOOK_DEFAULT_TIMEOUT_MS:-10000}
      WEBHOOK_MAX_RESPONSE_BODY_CHARS: ${WEBHOOK_MAX_RESPONSE_BODY_CHARS:-4000}
      WEBHOOK_ALLOW_PRIVATE_URLS: ${WEBHOOK_ALLOW_PRIVATE_URLS:-false}
      WEBHOOK_REQUIRE_HTTPS: ${WEBHOOK_REQUIRE_HTTPS:-true}
      WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}
      QUEUE_SCHEDULER_ENABLED: "false"
      SERVICE_HEARTBEAT_NAME: webhook-worker
    healthcheck: *worker-heartbeat-healthcheck
    networks:
      - default
      - egress

  dgii-ecf-migrate:
    container_name: ${COMPOSE_PROJECT_NAME:-dgii-ecf}-migrate
    image: ${DGII_ECF_ENGINE_IMAGE}:${DGII_ECF_ENGINE_TAG}
    profiles:
      - migrate
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      <<: *engine-env
      DATABASE_URL: ${DIRECT_DATABASE_URL:-postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public}
      RUN_PRISMA_MIGRATE_ON_BOOT: "false"
    deploy:
      resources: *worker-resources
    volumes:
      - dgii_ecf_engine_data:/data
      - dgii_ecf_engine_logs:/logs
    security_opt:
      - no-new-privileges:true

  dgii-ecf-portal:
    container_name: ${COMPOSE_PROJECT_NAME:-dgii-ecf}-portal
    image: ${DGII_ECF_PORTAL_IMAGE}:${DGII_ECF_PORTAL_TAG}
    restart: unless-stopped
    depends_on:
      dgii-ecf-engine:
        condition: service_healthy
        restart: true
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-America/Santo_Domingo}
      PORT: ${DGII_ECF_PORTAL_PORT:-3000}
      HOSTNAME: 0.0.0.0
      CHROMIUM_PATH: /usr/bin/chromium
      NPM_CONFIG_UPDATE_NOTIFIER: ${NPM_CONFIG_UPDATE_NOTIFIER:-false}
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:?NEXT_SERVER_ACTIONS_ENCRYPTION_KEY requerido}
      NEXT_PUBLIC_API_BASE_URL: https://${PUBLIC_ENGINE_URL}
      API_BASE_URL: https://${PUBLIC_ENGINE_URL}
    tmpfs:
      - /tmp:size=512m,nosuid
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: ${PORTAL_CPU_LIMIT:-1.00}
          memory: ${PORTAL_MEMORY_LIMIT:-1024M}
          pids: ${PORTAL_PIDS_LIMIT:-256}
        reservations:
          cpus: ${PORTAL_CPU_RESERVATION:-0.10}
          memory: ${PORTAL_MEMORY_RESERVATION:-128M}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS \"http://127.0.0.1:${DGII_ECF_PORTAL_PORT:-3000}/api/health\" || exit 1"
        ]
      interval: ${PORTAL_HEALTH_INTERVAL:-30s}
      timeout: ${PORTAL_HEALTH_TIMEOUT:-5s}
      start_period: ${PORTAL_HEALTH_START_PERIOD:-90s}
      retries: ${PORTAL_HEALTH_RETRIES:-5}
    labels:
      - traefik.enable=true
      - traefik.docker.network=${NETWORK:-proxy}
      - traefik.http.routers.dgii-ecf-portal.rule=Host(`${PORTAL_DOMAIN}`)
      - traefik.http.routers.dgii-ecf-portal.entrypoints=websecure
      - traefik.http.routers.dgii-ecf-portal.tls=true
      - traefik.http.routers.dgii-ecf-portal.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.services.dgii-ecf-portal.loadbalancer.server.port=${DGII_ECF_PORTAL_PORT:-3000}
      - traefik.http.middlewares.dgii-ecf-portal-headers.headers.customresponseheaders.X-Content-Type-Options=nosniff
      - traefik.http.middlewares.dgii-ecf-portal-headers.headers.customresponseheaders.Referrer-Policy=strict-origin-when-cross-origin
      - traefik.http.routers.dgii-ecf-portal.middlewares=dgii-ecf-portal-headers
    logging: *default-logging
    networks:
      - default
      - proxy

  pgadmin:
    container_name: ${COMPOSE_PROJECT_NAME:-dgii-ecf}-pgadmin
    image: ${PGADMIN_IMAGE:-dpage/pgadmin4}:${PGADMIN_TAG:-9.14.0}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?PGADMIN_DEFAULT_EMAIL requerido}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD requerido}
    security_opt:
      - no-new-privileges:true
    deploy:
      resources: *utility-resources
    logging: *default-logging
    labels:
      - traefik.enable=${INFRA_ADMIN_PUBLIC_ENABLED:-false}
      - traefik.docker.network=${NETWORK:-proxy}
      - traefik.http.routers.pgadmin.rule=Host(`${PGADMIN_DOMAIN}`)
      - traefik.http.routers.pgadmin.entrypoints=websecure
      - traefik.http.routers.pgadmin.tls=true
      - traefik.http.routers.pgadmin.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.services.pgadmin.loadbalancer.server.port=80
      - traefik.http.middlewares.infra-admin-ipallowlist.ipallowlist.sourcerange=${INFRA_ADMIN_ALLOWED_IPS:-127.0.0.1/32}
      - "traefik.http.middlewares.infra-admin-basicauth.basicauth.users=${INFRA_ADMIN_BASIC_AUTH_USERS:-disabled:{SHA}YHjTQ0VXlTKxiKyyCo5hU6n/Xgo=}"
      - traefik.http.middlewares.infra-admin-basicauth.basicauth.removeheader=true
      - traefik.http.middlewares.infra-admin-ratelimit.ratelimit.average=${INFRA_ADMIN_RATE_LIMIT_AVERAGE:-10}
      - traefik.http.middlewares.infra-admin-ratelimit.ratelimit.burst=${INFRA_ADMIN_RATE_LIMIT_BURST:-20}
      - traefik.http.middlewares.infra-admin-headers.headers.framedeny=true
      - traefik.http.middlewares.infra-admin-headers.headers.contenttypenosniff=true
      - traefik.http.middlewares.infra-admin-headers.headers.referrerpolicy=no-referrer
      - traefik.http.middlewares.infra-admin-chain.chain.middlewares=infra-admin-ipallowlist,infra-admin-basicauth,infra-admin-ratelimit,infra-admin-headers
      - traefik.http.routers.pgadmin.middlewares=infra-admin-chain
    networks:
      - default

  redisinsight:
    container_name: ${COMPOSE_PROJECT_NAME:-dgii-ecf}-redisinsight
    image: ${REDISINSIGHT_IMAGE:-redis/redisinsight}:${REDISINSIGHT_TAG:-3.4.2}
    restart: unless-stopped
    volumes:
      - redisinsight_data:/data
    environment:
      RI_REDIS_USERNAME: ${RI_REDIS_USERNAME:-default}
      RI_REDIS_PASSWORD: ${RI_REDIS_PASSWORD:-${REDIS_PASSWORD}}
    security_opt:
      - no-new-privileges:true
    deploy:
      resources: *utility-resources
    logging: *default-logging
    labels:
      - traefik.enable=${INFRA_ADMIN_PUBLIC_ENABLED:-false}
      - traefik.docker.network=${NETWORK:-proxy}
      - traefik.http.routers.redisinsight.rule=Host(`${REDISINSIGHT_DOMAIN}`)
      - traefik.http.routers.redisinsight.entrypoints=websecure
      - traefik.http.routers.redisinsight.tls=true
      - traefik.http.routers.redisinsight.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.services.redisinsight.loadbalancer.server.port=5540
      - traefik.http.routers.redisinsight.middlewares=infra-admin-chain
    networks:
      - default

volumes:
  pgadmin_data:
  redis_data:
  redisinsight_data:
  dgii_ecf_postgres_data:
  dgii_ecf_engine_data:
  dgii_ecf_engine_logs:

networks:
  backup_admin:
    internal: true
  egress:
  proxy:
    name: ${NETWORK:-proxy}
    external: true
  default:
    internal: true
