    pids: ${ENGINE_PIDS_LIMIT:-256}
  reservations:
    cpus: ${ENGINE_CPU_RESERVATION:-0.25}
    memory: ${ENGINE_MEMORY_RESERVATION:-256M}

x-worker-resources: &worker-resources
  limits:
    cpus: ${WORKER_CPU_LIMIT:-1.00}
    memory: ${WORKER_MEMORY_LIMIT:-1024M}
